<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">星空下的少女</title>
  <desc id="desc">一位少女望着月亮，身后是流动的星光与深夜城市。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08122b"/>
      <stop offset=".46" stop-color="#0d1838"/>
      <stop offset="1" stop-color="#060916"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#f7f2ff" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#a8dfff" stop-opacity=".66"/>
      <stop offset=".7" stop-color="#5d8fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#5d8fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1=".2" y1=".1" x2=".8" y2=".9">
      <stop stop-color="#fffaf2"/>
      <stop offset=".55" stop-color="#d9ecff"/>
      <stop offset="1" stop-color="#8fb5ff"/>
    </linearGradient>
    <linearGradient id="hair" x1=".1" y1=".2" x2=".9" y2=".9">
      <stop stop-color="#151a3e"/>
      <stop offset=".55" stop-color="#080c1d"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <linearGradient id="coat" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#1a2146"/>
      <stop offset=".5" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#050712"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7bc9"/>
      <stop offset=".5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#24e0ff"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#ff7dbb"/>
      <stop offset=".55" stop-color="#925bff"/>
      <stop offset="1" stop-color="#3f2a82"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07132d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#040712"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotPattern" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#a9c8ff" opacity=".3"/>
    </pattern>
    <clipPath id="posterClip">
      <rect width="900" height="1200" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#posterClip)">
    <rect width="900" height="1200" fill="url(#sky)"/>
    <rect width="900" height="1200" fill="url(#dotPattern)" opacity=".42"/>

