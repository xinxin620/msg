<!doctype html>
<!--
  ⚠ 本页脚本清单镜像自 canvas/index.html，但只保留「设置」需要的部分：
    bundle + web-bridge + branding + 5 个 API 补丁（图片/文本/视频/语音/ComfyUI）+ comfy-workflow + model-patch
    + SKILL模板（skill-templates-data + settings-skill-patch，仅本页使用）。
  刻意不加载：storage-migration（避免重载抖动）、gallery-patch（避免加入素材广播通道）、
    以及所有节点/检视器/小地图补丁（本页不画节点，省掉双份 150ms 轮询）。
  相对加载顺序必须与 index.html 一致：model-patch 早于 text/video/voice-api（fetch 劫持链依赖）。
  升级 bundle 或给画布加/改 API 补丁时，同步核对本清单与 canvas/index.html。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <link rel="icon" href="./icon.ico" />
    <title>设置 · 漫时光</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #eeecea;
        color: #1a1a1a;
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      #canvasBoot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 24px;
        background: #eeecea;
        color: #555;
        text-align: center;
        transition: opacity 180ms ease;
      }

      #canvasBoot strong {
        font-size: 15px;
        font-weight: 600;
      }

      #canvasBoot small {
        max-width: 520px;
        color: #888;
        line-height: 1.7;
      }

      #canvasBoot[data-ready="true"] {
        pointer-events: none;
        opacity: 0;
      }

      #canvasBoot[data-error="true"] strong {
        color: #b42318;
      }

      /* 与画布同源的设置侧栏滚动规则，复制自 canvas/index.html，
         保证 tab 越加越多时整栏一起滚动、作者信息贴底。 */
      .settings-sidebar {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      .settings-sidebar__nav {
        flex: 0 0 auto;
        min-height: 0;
        overflow: visible;
      }
      .settings-sidebar__author {
        flex: 0 0 auto;
        overflow: visible;
        margin-top: auto;
      }
    </style>
    <script>
      (() => {
        const currentVersion = "20261123-1";
        const url = new URL(window.location.href);
        if (url.searchParams.get("v") === currentVersion) return;
        url.searchParams.set("v", currentVersion);
        window.location.replace(url.href);
      })();
    </script>
    <link rel="stylesheet" href="./assets/index-BfAuAU0s.css" />
    <script src="./web-bridge.js?v=20261123-1"></script>
    <script defer src="./assets/index-BN-uSJKj.js"></script>
    <script defer src="./branding-patch.js?v=20261116-15"></script>
    <script defer src="./api-profiles-patch.js?v=20261116-15"></script>
    <script defer src="./comfy-workflow.js?v=20261122-3"></script>
    <script defer src="./comfy-patch.js?v=20261120-2"></script>
    <script defer src="./model-patch.js?v=20261119-1"></script>
    <script defer src="./text-api-patch.js?v=20261116-15"></script>
    <script defer src="./video-api-patch.js?v=20261119-24"></script>
    <script defer src="./voice-api-patch.js?v=20261123-1"></script>
    <script defer src="./skill-templates-data.js?v=20261123-1"></script>
    <script defer src="./settings-skill-patch.js?v=20261123-1"></script>
    <script defer src="./settings-page-patch.js?v=20261123-1"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="canvasBoot" role="status" aria-live="polite">
      <strong>正在打开设置…</strong>
      <small>正在载入模型与接口配置</small>
    </div>
    <script>
      (() => {
        const boot = document.getElementById("canvasBoot");
        const root = document.getElementById("root");
        if (!boot || !root) return;

        const markReady = () => {
          if (!root.firstElementChild) return;
          boot.dataset.ready = "true";
          window.setTimeout(() => boot.remove(), 220);
        };

        new MutationObserver(markReady).observe(root, { childList: true });
        markReady();

        window.addEventListener(
          "error",
          (event) => {
            if (root.firstElementChild || !event?.message) return;
            boot.dataset.error = "true";
            boot.innerHTML =
              "<strong>设置页加载失败</strong><small>请使用本地静态服务器打开本页，并查看浏览器控制台中的错误信息。</small>";
          },
          true,
        );

        window.setTimeout(() => {
          if (root.firstElementChild) return;
          boot.dataset.error = "true";
          boot.innerHTML =
            "<strong>设置页尚未完成加载</strong><small>浏览器可能阻止了本地脚本。建议在项目根目录运行静态服务器后访问 /canvas/settings.html。</small>";
        }, 12000);
      })();
    </script>
  </body>
</html>
