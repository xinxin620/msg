<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="漫时光小游戏：看背影识人。按难度抽卡、限时辨认、计分排行。" />
    <meta name="theme-color" content="#eeecea" />
    <title>看背影识人 · 漫时光</title>
    <link rel="icon" href="../assets/favicon.ico?v=20261117-1" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png?v=20261117-1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Outfit:wght@400;600;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/game.css?v=20261117-1" />
    <script src="assets/game.js?v=20261117-1" defer></script>
  </head>
  <body>
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6" /></symbol>
      <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9.5" r="1.5" /><path d="m20 16-5-5L5 20" /></symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0Z" /><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3" /><path d="M12 13v4M9 20h6" /></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" /></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></symbol>
    </svg>

    <div class="game-shell">
      <header class="game-bar">
        <a class="bar-back" id="backHome" href="../index.html">
          <svg class="icon"><use href="#icon-back"></use></svg>
          <span>返回首页</span>
        </a>
        <div class="bar-title">
          <p class="bar-kicker">BACK VIEW QUIZ</p>
          <h1>看背影识人</h1>
        </div>
        <div class="bar-actions">
          <button class="ghost-btn" type="button" id="openSourceBtn">
            <svg class="icon"><use href="#icon-image"></use></svg>
            <span>素材库</span>
            <span class="badge" id="rosterBadge">0</span>
          </button>
          <button class="ghost-btn" type="button" id="openBoardBtn">
            <svg class="icon"><use href="#icon-trophy"></use></svg>
            <span>排行榜</span>
          </button>
        </div>
      </header>

      <main class="game-main">
        <section class="screen is-active" data-screen="select">
          <p class="intro-note" id="introNote"></p>
          <div class="level-grid" id="levelGrid"></div>
          <div class="select-foot">
            <div class="player-field">
              <label for="playerName">玩家昵称</label>
              <input id="playerName" type="text" maxlength="12" placeholder="时光旅人" autocomplete="off" />
            </div>
            <div class="mini-stats" id="miniStats"></div>
          </div>
        </section>

        <section class="screen" data-screen="play">
          <div class="play-hud">
            <div class="hud-left">
              <span class="hud-level" id="hudLevel"></span>
              <div class="pips" id="pips"></div>
            </div>
            <div class="hud-right">
              <span class="hud-combo" id="hudCombo"></span>
              <span class="hud-score" id="hudScore">0</span>
              <div class="timer"><div class="timer-fill" id="timerFill"></div></div>
            </div>
          </div>
          <div class="stage">
            <div class="stage-frame">
              <img id="questionImage" alt="背影素材" />
              <div class="stage-empty" id="stageEmpty">
                <svg class="icon"><use href="#icon-image"></use></svg>
                <p>该人物还没有背影素材</p>
                <small>放进 <code>game/assets/backview/&lt;人物ID&gt;/</code> 后重新载入</small>
              </div>
            </div>
            <p class="stage-hint" id="stageHint"></p>
          </div>
          <div class="options" id="options"></div>
          <p class="feedback" id="feedback"></p>
        </section>

        <section class="screen" data-screen="result">
          <div class="result-card">
            <p class="result-kicker">ROUND CLEAR</p>
            <div class="result-score" id="resultScore">0</div>
            <p class="result-rank" id="resultRank"></p>
            <div class="result-grid">
              <div><strong id="statAccuracy">0%</strong><span>正确率</span></div>
              <div><strong id="statCorrect">0/0</strong><span>答对</span></div>
              <div><strong id="statCombo">0</strong><span>最高连击</span></div>
              <div><strong id="statTime">0.0s</strong><span>平均用时</span></div>
            </div>
            <div class="result-actions">
              <button class="primary-btn" type="button" id="againBtn">再来一局</button>
              <button class="ghost-btn" type="button" id="shareBtn">生成战绩图</button>
              <button class="ghost-btn" type="button" id="pickBtn">换个难度</button>
            </div>
            <canvas id="shareCanvas" width="720" height="960" hidden></canvas>
          </div>
          <div class="wrong-list">
            <p class="wrong-title">本局认错的人</p>
            <div class="wrong-body" id="wrongBody"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="sheet-mask" id="sourceSheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sourceSheetTitle">
        <div class="sheet-head">
          <div>
            <p class="bar-kicker">ROSTER</p>
            <h2 id="sourceSheetTitle">素材库</h2>
          </div>
          <button class="icon-btn" type="button" id="closeSourceBtn" aria-label="关闭"><svg class="icon"><use href="#icon-close"></use></svg></button>
        </div>
        <div class="sheet-body">
          <div class="sheet-stats" id="sheetStats"></div>
          <p class="sheet-tip">
            素材按<strong>人</strong>组织：<code>game/assets/backview/&lt;人物ID&gt;/</code> 里丢该人物的背影图，文件名任意。
            一个人多张图会随机抽，不会反复考同一张。名字与标签写在 <code>game/data/roster.json</code>。
          </p>
          <div class="sheet-actions">
            <button class="ghost-btn" type="button" id="reloadAssetsBtn">
              <svg class="icon"><use href="#icon-refresh"></use></svg><span>重新载入素材</span>
            </button>
            <button class="ghost-btn" type="button" id="pickDirBtn">
              <svg class="icon"><use href="#icon-folder"></use></svg><span>授权外部素材目录</span>
            </button>
            <button class="ghost-btn is-danger" type="button" id="clearDirBtn">清除目录授权</button>
          </div>
          <p class="sheet-note" id="dirNote"></p>
          <div class="people-list" id="peopleList"></div>
        </div>
      </div>
    </div>

    <div class="sheet-mask" id="boardSheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="boardSheetTitle">
        <div class="sheet-head">
          <div>
            <p class="bar-kicker">LEADERBOARD</p>
            <h2 id="boardSheetTitle">排行榜</h2>
          </div>
          <button class="icon-btn" type="button" id="closeBoardBtn" aria-label="关闭"><svg class="icon"><use href="#icon-close"></use></svg></button>
        </div>
        <div class="sheet-body">
          <div class="board-tabs" id="boardTabs"></div>
          <ol class="board-list" id="boardList"></ol>
          <div class="sheet-actions">
            <button class="ghost-btn is-danger" type="button" id="clearBoardBtn">清空榜单</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
