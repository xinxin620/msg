<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="漫时光 AI 创作工作台：把画布、资产库、剧情导演台等工作区集成在同一处。" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <title>AI 创作工作台 · 漫时光</title>
    <link rel="icon" href="../assets/favicon.ico?v=20261108-27" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png?v=20261108-27" />
    <link rel="stylesheet" href="assets/studio.css?v=20261108-27" />
    <script>
      (() => {
        const currentVersion = "20261108-23";
        const url = new URL(window.location.href);
        if (url.searchParams.get("v") === currentVersion) return;
        url.searchParams.set("v", currentVersion);
        window.location.replace(url.href);
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#studioStage">跳到工作区</a>

    <div class="studio">
      <aside class="studio-rail" aria-label="工作区导航">
        <div class="rail-brand">
          <span class="rail-mark" aria-hidden="true">
            <span class="rail-orbit"></span>
            <span class="rail-core"></span>
          </span>
          <span class="rail-copy">
            <strong>AI 创作工作台</strong>
            <small>MANSHIGUANG STUDIO</small>
          </span>
        </div>

        <p class="rail-section">WORKSPACES</p>
        <nav class="rail-list" role="tablist" aria-orientation="vertical" aria-label="工作区" id="railList"></nav>

        <div class="rail-foot">
          <button class="rail-chip" id="assetDirChip" type="button" aria-describedby="assetDirHint">
            <span class="chip-dot" id="assetDirDot" aria-hidden="true"></span>
            <span class="chip-body">
              <strong id="assetDirLabel">资产目录</strong>
              <small id="assetDirHint">点击授权画布与资产库共用的本地目录</small>
            </span>
          </button>
          <a class="rail-back" href="../index.html?v=20261108-27">
            <svg class="icon" aria-hidden="true"><use href="#icon-back"></use></svg>
            <span>返回漫时光</span>
          </a>
        </div>
      </aside>

      <main class="studio-main">
        <header class="studio-bar">
          <div class="bar-copy">
            <p class="bar-kicker" id="barKicker">CANVAS</p>
            <h1 id="barTitle">画布</h1>
            <p class="bar-desc" id="barDesc">节点式工作流编排</p>
          </div>
          <div class="bar-tools">
            <a class="bar-btn" href="../index.html?v=20261108-27" title="返回首页">
              <svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg>
              <span>首页</span>
            </a>
            <button class="bar-btn" id="refreshBtn" type="button" title="重新载入当前工作区">
              <svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              <span>重载</span>
            </button>
            <button class="bar-btn" id="openTabBtn" type="button" title="在独立标签页打开当前工作区">
              <svg class="icon" aria-hidden="true"><use href="#icon-external"></use></svg>
              <span>新标签页</span>
            </button>
          </div>
        </header>

        <div class="studio-stage" id="studioStage" aria-live="polite">
          <div class="stage-boot" id="stageBoot">
            <span class="boot-orbit" aria-hidden="true"></span>
            <strong id="bootLabel">正在准备工作区…</strong>
            <small>工作区在本地静态服务器上运行，首次载入需要读取索引与授权目录。</small>
          </div>
          <div class="stage-frame" id="stageFrame"></div>
          <div class="stage-note" id="stageNote" hidden>
            <svg class="icon" aria-hidden="true"><use href="#icon-warn"></use></svg>
            <p id="stageNoteText"></p>
          </div>
        </div>
      </main>
    </div>

            <svg class="sprite" aria-hidden="true">
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6" /></symbol>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 12v7h14v-7"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" /></symbol>
      <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></symbol>
      <symbol id="icon-warn" viewBox="0 0 24 24"><path d="M12 9v5M12 17h.01M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></symbol>
      <symbol id="icon-canvas" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><path d="M17.5 14v7M14 17.5h7" /></symbol>
      <symbol id="icon-assets" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9.5" r="1.5" /><path d="m20 16-5-5L5 20" /></symbol>
      <symbol id="icon-story" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5Z" /><path d="M9 8h6M9 12h4" /></symbol>
      <symbol id="icon-image" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4" /><circle cx="12" cy="12" r="4" /></symbol>
      <symbol id="icon-human" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5" /><path d="M5 21c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5" /></symbol>
      <symbol id="icon-task" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" /><path d="m3 6 1.2 1.2L6.6 4.8M3 12l1.2 1.2 2.4-2.4M3 18l1.2 1.2 2.4-2.4" /></symbol>
    </svg>

    <template id="soonTemplate">
      <div class="soon">
        <div class="soon-head">
          <span class="soon-icon" data-slot="icon" aria-hidden="true"></span>
          <div>
            <h2 data-slot="title"></h2>
            <p data-slot="tagline"></p>
          </div>
          <span class="soon-state" data-slot="state"></span>
        </div>
        <div class="soon-grid">
          <section>
            <h3>这个工作区做什么</h3>
            <p data-slot="purpose"></p>
          </section>
          <section>
            <h3>输入</h3>
            <ul data-slot="inputs"></ul>
          </section>
          <section>
            <h3>产出</h3>
            <ul data-slot="outputs"></ul>
          </section>
          <section>
            <h3>与现有能力的关系</h3>
            <p data-slot="relation"></p>
          </section>
        </div>
        <p class="soon-foot" data-slot="foot"></p>
      </div>
    </template>

    <script src="assets/studio.js?v=20261108-27" defer></script>
  </body>
</html>
